spring.application.name=Assistant Telegram Bot

# Server Configuration
server.port=8080

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=2000

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}

# MCP Server Configuration
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=weather-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=This server provides weather information tools. You can get current weather, forecasts, alerts, and statistics for various cities.
spring.ai.mcp.server.path=/mcp

# MCP Client Configuration - DISABLED AUTOCONFIGURATION
spring.ai.mcp.client.type=sync
spring.ai.mcp.client.enabled=false
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.toolcallback.enabled=false

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator