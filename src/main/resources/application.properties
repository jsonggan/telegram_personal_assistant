spring.application.name=Assistant Telegram Bot

# Server Configuration
server.port=8080

spring.ai.openai.api-key=${OPENAI_API_KEY}

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}

# MCP Server Configuration
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=weather-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=This server provides weather information tools. You can get current weather, forecasts, alerts, and statistics for various cities.
spring.ai.mcp.server.path=/mcp

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator